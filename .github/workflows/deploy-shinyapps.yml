name: Deploy to ShinyApps.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev

      # No repos= here: setup-r (use-public-rspm) points R at Posit Package
      # Manager, which serves prebuilt Linux binaries. Building from CRAN source
      # failed on newer runners (fs needs libuv), which silently dropped shiny
      # from the bundle and broke the live app.
      - name: Install R packages
        run: |
          install.packages(c('rsconnect', 'shiny', 'bslib', 'ggplot2', 'plotly', 'tidyr', 'dplyr', 'shinythemes'))
        shell: Rscript {0}

      # Stop before deploying if anything the app loads is missing
      - name: Verify R packages
        run: |
          pkgs <- c('rsconnect', 'shiny', 'bslib', 'ggplot2', 'plotly', 'tidyr', 'dplyr', 'shinythemes')
          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) stop("Missing packages: ", paste(missing, collapse = ", "))
          packageVersion('rsconnect')
        shell: Rscript {0}

      - name: Deploy to ShinyApps.io
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir = ".",
            appName = "bayesian-explorer",
            forceUpdate = TRUE
          )
        shell: Rscript {0}